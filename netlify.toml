[build]
  publish = "."

[[redirects]]
  from = "/marketing-strategy-consultant*"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/cmo-for-hire*"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/blog*"
  to = "/"
  status = 301

[[redirects]]
  from = "/rice-scoring-tool*"
  to = "/"
  status = 301

[[redirects]]
  from = "/go-to-market-strategies-for-startups*"
  to = "/"
  status = 301

[[redirects]]
  from = "/startup-founders-guide-to-outsourced-marketing*"
  to = "/"
  status = 301

[[redirects]]
  from = "/how-to-hire-a-director-of-marketing*"
  to = "/"
  status = 301

[[redirects]]
  from = "/free-marketing-tools-for-startup-growth*"
  to = "/"
  status = 301

[[redirects]]
  from = "/privacy*"
  to = "/"
  status = 301

[[redirects]]
  from = "/do-not-share*"
  to = "/"
  status = 301

[[redirects]]
  from = "/opt-out-preferences*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
